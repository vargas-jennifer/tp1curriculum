    <body> 
        <header>
            <div class="contenedor">

                <a href="index.html"><div class="logo"></div></a>

                <nav>
                    <a href="index.html">inicio</a>
                    <a href="sobre-mi.html">sobre mí</a>
                    <a href="portfolio.html">portfolio</a>
                    <a href="#">contacto</a>
                </nav>
            </div>
        </header>
        <main>

            <section>
                <h1>contacto</h1>
                <p>trabajemos juntos, contáctame :)</p>

                <form method="post" action="" target="_blank" enctype="text/plain">
                    
                    <div>
                        <label for="nombre">nombre*</label>
                        <input type="text" name="nombre" id="nombre" maxlength="30" placeholder="tu nombre y apellido" required>  
                        <label for="telefono">teléfono*</label>
                        <input type="tel" name="teléfono" id="telefono" placeholder="tu número de celular">
                    

                        <div class="checkbox">
                            <label for="proyecto"><input type="checkbox" name="proyecto" value="fotografía" id="foto">fotografía</label>
                            <label for="proyecto"><input type="checkbox" name="proyecto" value="diseño editorial" id="editorial">diseño editorial</label>
                            <label for="proyecto"><input type="checkbox" name="proyecto" value="identidad visual" id="identidad">identidad visual</label>
                        </div>
                    </div>
                    <div>
                        <label for="mensaje">mensaje*</label>
                        <textarea name="mensaje" id="mensaje" maxlength="300" placeholder="hola! me gustaría contactarte porque..." required></textarea>  
                        <p>* campos obligatorios</p>
                        <input type="reset" value="borrar" class="borrar">
                        <input type="submit" value="enviar" class="enviar">
                    </div>

                </form>
                
            </section>

        </main>

        <footer>
            <a href="https://www.behance.net/jennifervar" target="_blank" class="behance"><img src="imagenes/botones/behance.png" alt="ícono de behance" width="36" height="36"></a>

            <a href="#" class="gmail"><img src="imagenes/botones/gmail.png" alt="ícono de gmail" width="36" height="36"></a>
        </footer>
    </body>
