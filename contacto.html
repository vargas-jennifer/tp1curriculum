<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />  
        <title>mi-portfolio</title>
        <link href=estilos.css rel="stylesheet" type="text/css"> 
        <link rel="icon" type="image/png" href="imagenes/favicon_florcita.png">
    </head>
    
    <body> 
        <header>
            <div class="contenedor">
                <a href="index.html">
                    <img src="imagenes/logo.png" alt="ícono" width="50" height="33">
                </a>
                <nav>
                    <a href="index.html">inicio</a>
                    <a href="sobre-mi.html">sobre mí</a>
                    <a href="portfolio.html">portfolio</a>
                    <a href="#">contacto</a>
                </nav>
            </div>
        </header>
        <main>

            <section>
                <h1>contacto</h1>
                <p>seguime en mis redes, trabajemos juntos :)</p>
                <img src="imagenes/behance.png" alt="ícono de behance" width="36" height="36">
                <img src="imagenes/ig.png" alt="ícono de instagram" width="36" height="36">
                <img src="imagenes/gmail.png" alt="ícono de gmail" width="36" height="36">

                <p>...o podes completar el formulario</p>

                <form method="post" action="" target="_blank" enctype="text/plain">
                    
                    <div>
                        <label for="nombre">nombre*</label>
                        <input type="text" name="nombre" id="nombre" maxlength="30" placeholder="tu nombre" required>  
                        <label for="telefono">teléfono*</label>
                        <input type="tel" name="teléfono" id="telefono" placeholder="12345678">
                    </div>

                    <div>
                        <label for="proyecto">diseño editorial<input type="checkbox" name="proyecto" value="diseño editorial" id="editorial"></label>
                        <label for="proyecto">fotografía<input type="checkbox" name="proyecto" value="fotografía" id="foto"></label>
                        <label for="proyecto">identidad visual<input type="checkbox" name="proyecto" value="identidad visual" id="identidad"></label>
                    </div>

                    <label for="mensaje">mensaje</label>
                    <textarea name="mensaje" id="mensaje" maxlength="300"></textarea>  
                    
                    <input type="reset" value="borrar" class="borrar">
                    <input type="submit" value="enviar" class="enviar">

                </form>

                <p>* campos obligatorios</p>
            </section>

        </main>

        <footer>
            <a href="#"><img src="imagenes/behance.png" alt="ícono de behance" width="36" height="36"></a>
            <a href="#"><img src="imagenes/ig.png" alt="ícono de instagram" width="36" height="36"></a>
            <a href="#"><img src="imagenes/gmail.png" alt="ícono de gmail" width="36" height="36"></a>
        </footer>
    </body>
</html>
